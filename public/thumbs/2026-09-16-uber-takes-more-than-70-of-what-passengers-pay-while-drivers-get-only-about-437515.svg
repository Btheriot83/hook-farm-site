<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#15202b"/><rect x="55" y="55" width="1090" height="565" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="3"/><text x="70" y="114" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Uber takes more than 70% of what</text><text x="70" y="182" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">passengers pay, while drivers get</text><text x="70" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">only about 30%. Drivers do all the</text><text x="70" y="318" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">work, yet the company keeps most</text><text x="70" y="386" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">of the money…</text><text x="70" y="590" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity=".65">X packaging reference · rideshare</text></svg>